# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[$c](bold fg:#D3EAEB)\
[$python](bold fg:#E9EBD3)
[╔](white)\\[$username\
$hostname\
$directory\\]\
$fill\
(\\[$git_branch\
$git_status\\])\
$fill\
\\[$time\\]
[╚](white)[═](white)$character
"""

add_newline=true

[directory]
truncation_length = 3
format = ' [$path]($style)'
use_os_path_sep = false
home_symbol = '~'
style='bold fg:#9EBDBA'

[username]
format = '[$user@]($style)'
show_always = true
style_user = 'white bold'
style_root = 'red bold'

[hostname]
ssh_only=false
format='[$hostname]($style)'
style='bold blue dimmed'

[git_branch]
format = " at [$branch]($style) "
style='bold fg:#B34045'

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style='fg:blue'

[character]
success_symbol = "[➤](white)"
error_symbol = "[➤](bright-red)"

[c]
format = ' [($version(-$name) )]($style)'
version_format='v${raw}'
style='fg:#CBA4DB'

[python]
format=' [python (${version} )(\($virtualenv\) )]($style)'
style='bold fg:#E9EBD3'

[fill]
symbol='-'
style='(bold fg:#ffffff)'

[line_break]
disabled=false

[time]
disabled=false
format = '[$time]($style)'
style='bold blue'
time_format='%T'

[cmd_duration]
disabled=true

